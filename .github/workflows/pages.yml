name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # `ubuntu-latest` now resolves to Ubuntu 26.04, where the current Pages
    # deploy action is forced onto a newer Node runtime and never receives a
    # deployment status. Keep this static-site job on the supported runner.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload landing
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
