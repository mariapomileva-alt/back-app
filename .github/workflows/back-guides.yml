name: Publish approved Back Guides

on:
  schedule:
    # UTC: covers 15:00–18:00 Riga in both summer and winter.
    - cron: '0,17,37,57 12-15 * * 1,3,5'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Publish due owner-approved article (false = checks only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: back-guides-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests and approved content validation
        run: python -m unittest discover -s tests -p 'test_back_guides_publisher.py'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Check or publish
        id: release
        env:
          EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute == true }}
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$EXECUTE" = 'true' ]; then
            python scripts/back_guides_publisher.py publish-due --execute
            # Retry deployment on a later tick if an earlier deployment failed.
            if [ -f landing/guides/index.html ]; then
              echo 'deploy=true' >> "$GITHUB_OUTPUT"
            fi
          else
            python scripts/back_guides_publisher.py preflight
            python -c 'import back_guides_publisher as p; p.check_git_clean(); [p.require_publishable(a) for a in p.load_schedule()["articles"] if a["status"] == "approved"]; print("Approved articles and Git validated; nothing published.")'
          fi
        # Make the module importable for the read-only full validation.
        working-directory: .
  deploy:
    needs: publish
    if: needs.publish.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
